linters:
  AltText:
    enabled: true

  ClassesBeforeIds:
    enabled: false

  ConsecutiveComments:
    enabled: false

  ConsecutiveSilentScripts:
    enabled: false

  IdNames:
    enabled: false

  InlineStyles:
    exclude: app/views/user_mailer/*

  # The plain-text parts of emails have no HTML context to escape into, and escaping
  # there turns apostrophes in translated text and post subjects into &#39; in the mail.
  UnescapedHtml:
    exclude: "**/*.text.haml"

  InstanceVariables:
    enabled: false

  LeadingCommentSpace:
    enabled: false

  LineLength:
    enabled: false

  SpaceBeforeScript:
    enabled: false

  SpaceInsideHashAttributes:
    enabled: false

  StrictLocals:
    enabled: true

  ViewLength:
    enabled: false
